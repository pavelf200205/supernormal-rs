[package]
name = "supernormal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
burn = { version = "=0.22.0", default-features = false, features = ["std", "wgpu", "flex", "optim", "extension", "cubecl"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_chacha = { version = "0.9", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "exr"] }
ndarray = "0.16"
ndarray-npy = "0.9"
nalgebra = "0.34"
safetensors = "0.6"
bytemuck = "1"
half = "2"
rayon = "1.12"
ahash = "0.8"
cubecl = "0.11"
burn-cubecl = "=0.22.0"
burn-fusion = "=0.22.0"
burn-ir = "=0.22.0"
burn-backend = "=0.22.0"

[profile.release]
lto = "thin"
codegen-units = 1

